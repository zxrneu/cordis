name: Python

on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing project tooling
        run: python -m pip install uv==0.11.11
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Type check
        run: uv run --no-sync mypy
      - name: Lint
        run: uv run --no-sync ruff check src tests examples tools
      - name: Unit and failure-path tests
        env:
          PYTHONWARNINGS: error::RuntimeWarning
        run: uv run --no-sync python -m unittest discover -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.11
      - name: Build sdist and wheel
        run: uv build --clear
      - name: Test installed wheel outside source imports
        run: uv run --no-project --isolated --with dist/*.whl python -I tools/smoke_wheel.py
