[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordis-python"
version = "0.2.0"
description = "A Python runtime for spatiotemporally composable components"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples/demo.py", "examples/tutorial.py", "examples/order_importer", "typing_tests/contracts.py"]
mypy_path = "src"
enable_error_code = ["ignore-without-code"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cordis = ["py.typed"]
