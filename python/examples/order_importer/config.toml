# Paths are relative to this configuration file.
[database]
# Switch to "memory" to replace the store without changing consumers.
provider = "sqlite"
path = "var/orders.sqlite3"

[validation]
# Decimal text avoids floating-point rounding. Change to "100.00" while running.
max_amount = "100.00"

[importer]
directory = "incoming"
interval = 0.5

[logging]
enabled = true
